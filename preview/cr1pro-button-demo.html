<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>CR1PRO 手柄预览</title>
  <style>
  :root { color-scheme: light dark; background: light-dark(#fff, #181818); }
  #cr1-button-flow {
    color-scheme: light dark;
    --preview-ink: light-dark(#17202d, #f1f5fb);
    --preview-muted: light-dark(#526477, #afbed0);
    --preview-edge: light-dark(#d5dde8, #445269);
    max-width: 1180px; margin: 0 auto; padding: 10px 0; container-type: inline-size;
    color: var(--preview-ink);
    font: 14px/1.5 system-ui, sans-serif;
  }
  #cr1-button-flow * { box-sizing: border-box; }
  #cr1-button-flow [hidden] { display: none !important; }
  #cr1-button-flow .cr1-preview-header, #cr1-button-flow .cr1-feedback {
    display: flex; justify-content: space-between; align-items: center; gap: 8px 16px;
    flex-wrap: wrap;
  }
  #cr1-button-flow .cr1-preview-header { margin-bottom: 10px; }
  #cr1-button-flow h2 { margin: 0; font-size: 19px; font-weight: 650; }
  #cr1-button-flow .cr1-caption { color: var(--preview-muted); font-size: 12px; }
  #cr1-button-flow .cr1-feedback { justify-content: flex-start; padding-top: 9px; }
  #cr1-button-flow .cr1-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #cr1-button-flow button { font: inherit; }
  #cr1-button-flow button:not(:disabled) { cursor: pointer; }
  #cr1-button-flow .cr1-device {
    display: flex; flex-direction: column; width: 100%; min-height: max(450px, 56.25cqw);
    color-scheme: dark; color: #fff;
    background: #191a1d var(--cr1-background, none) center / 100% 100% no-repeat;
  }
  #cr1-button-flow .cr1-header, #cr1-button-flow .cr1-mode, #cr1-button-flow .cr1-top-right {
    display: flex; align-items: center;
  }
  #cr1-button-flow .cr1-header {
    justify-content: space-between; min-height: 41px; background: #000c;
  }
  #cr1-button-flow .cr1-mode { gap: 7px; padding-left: 16px; font-size: 17px; }
  #cr1-button-flow .cr1-top-right { gap: 15px; }
  #cr1-button-flow .cr1-back, #cr1-button-flow .cr1-settings {
    display: inline-block; width: 24px; height: 24px;
    background: var(--cr1-back, none) center / contain no-repeat;
  }
  #cr1-button-flow .cr1-settings { background-image: var(--cr1-settings, none); }
  #cr1-button-flow .cr1-mode-arrow, #cr1-button-flow .cr1-battery { color: #ddd; font-size: 12px; }
  #cr1-button-flow .cr1-stop {
    width: 85px; min-height: 41px; border: 0; color: #fff;
    background: #c33 var(--cr1-stop, none) center / 100% 100% no-repeat;
    font-size: 24px; font-weight: 800; font-style: italic;
  }
  #cr1-button-flow .cr1-body {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; padding: 15px 19px 19px;
  }
  #cr1-button-flow .cr1-left { width: min(520px, 100%); min-width: 0; display: grid; gap: 13px; }
  #cr1-button-flow .cr1-primary-row { gap: 13px; }
  #cr1-button-flow .cr1-primary-row button { min-width: 110px; }
  #cr1-button-flow .cr1-pad {
    width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 13px 8px;
  }
  #cr1-button-flow .cr1-pad > button { order: -1; }
  #cr1-button-flow .cr1-pad button { min-width: 0; }
  #cr1-button-flow .cr1-action-options {
    grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
  }
  @media (max-width: 460px) {
    #cr1-button-flow .cr1-pad, #cr1-button-flow .cr1-action-options {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }
  #cr1-button-flow .cr1-left button, #cr1-button-flow .cr1-speed {
    min-height: 41px; padding: 5px 7px; border: 1px solid #ffffff24;
    border-radius: 999px; color: #fff; background: #000c;
  }
  #cr1-button-flow .cr1-left button:enabled:hover,
  #cr1-button-flow .cr1-left [aria-current="true"] {
    background: #266efd;
  }
  #cr1-button-flow .cr1-left button:disabled:not([aria-current="true"]) { color: #fff8; }
  #cr1-button-flow .cr1-speed {
    display: grid; align-items: center; text-align: center;
    width: 41px; border-radius: 50%; font-size: 11px;
  }
  #cr1-button-flow .cr1-tools { display: grid; gap: 12px; text-align: center; font-size: 11px; }
  #cr1-button-flow .cr1-tools span { display: grid; gap: 2px; justify-items: center; white-space: nowrap; }
  #cr1-button-flow .cr1-tools span::before {
    content: ""; display: block; width: 41px; height: 41px; border-radius: 50%;
    background: #000b var(--cr1-tool, none) center / 22px no-repeat;
  }
  #cr1-button-flow [data-tool="video"] { --cr1-tool: var(--cr1-video); }
  #cr1-button-flow [data-tool="record"] { --cr1-tool: var(--cr1-record); }
  #cr1-button-flow [data-tool="camera"] { --cr1-tool: var(--cr1-camera); }
  #cr1-button-flow [data-tool="joints"] { --cr1-tool: var(--cr1-joints); }
  #cr1-button-flow [data-tool="motion"] { --cr1-tool: var(--cr1-motion); }
  @media (max-width: 570px) {
    #cr1-button-flow .cr1-device { min-height: 405px; background-size: cover; background-position: 56% center; }
    #cr1-button-flow .cr1-body { gap: 8px; padding: 12px 8px; }
    #cr1-button-flow .cr1-pad { gap: 8px; }
    #cr1-button-flow .cr1-primary-row { gap: 7px; }
    #cr1-button-flow .cr1-primary-row button { min-width: 85px; }
    #cr1-button-flow .cr1-left button { min-height: 44px; font-size: 12px; }
    #cr1-button-flow .cr1-mode { padding-left: 8px; }
    #cr1-button-flow .cr1-top-right { gap: 8px; }
    #cr1-button-flow .cr1-stop { width: 68px; }
    #cr1-button-flow .cr1-tools { gap: 8px; }
    #cr1-button-flow .cr1-tools span::before { width: 32px; height: 32px; background-size: 18px; }
  }

    body { margin: 0; padding: 1rem; }
    #cr1-button-flow button:focus-visible, #cr1-button-flow summary:focus-visible {
      outline: 2px solid #76aafa; outline-offset: 3px;
    }
    #cr1-button-flow .cr1-command-table { margin-top: 0.75rem; }
    #cr1-button-flow .cr1-command-table summary { cursor: pointer; }
    #cr1-button-flow table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    #cr1-button-flow th, #cr1-button-flow td {
      padding: 0.4rem 0.5rem; text-align: left; border-bottom: 1px solid var(--preview-edge);
    }
    #cr1-button-flow dialog {
      width: min(440px, calc(100% - 2rem)); border: 1px solid #ffffff40; border-radius: 8px;
      background: #191a1d; color: #fff; padding: 18px;
    }
    #cr1-button-flow dialog::backdrop { background: #000b; }
    #cr1-button-flow dialog h2 { margin: 0; }
    #cr1-button-flow dialog p { margin: 10px 0 15px; }
    #cr1-button-flow dialog form { display: flex; justify-content: flex-end; gap: 8px; }
    #cr1-button-flow dialog button {
      border: 1px solid #ffffff40; border-radius: 6px; padding: 6px 12px; background: #222; color: #fff;
    }
    #cr1-button-flow #dialog-accept { border-color: #266efd; background: #266efd; }
    #cr1-button-flow .cr1-speed-control { position: relative; }
    #cr1-button-flow .cr1-primary-row .cr1-speed { min-width: 0; }
    #cr1-button-flow .cr1-speed-panel {
      position: absolute; z-index: 1; top: calc(100% + 7px); padding: 8px;
      border: 1px solid #ffffff40; border-radius: 6px; background: #191a1d;
    }
    #cr1-button-flow .cr1-speed-panel input { accent-color: #266efd; width: 120px; }
    @media (max-width: 570px) {
      body { padding: 0.5rem; }
    }
    @media (orientation: landscape) and (max-height: 880px) {
      body { padding: 6px 8px; }
      #cr1-button-flow {
        display: flex; flex-direction: column; min-height: calc(100svh - 12px); padding: 0;
      }
      #cr1-button-flow .cr1-preview-header { gap: 4px 10px; margin-bottom: 4px; }
      #cr1-button-flow .cr1-preview-header h2 { font-size: 16px; }
      #cr1-button-flow .cr1-preview-header .cr1-caption { display: none; }
      #cr1-button-flow .cr1-device { flex: 1; min-height: 0; background-size: cover; }
      #cr1-button-flow .cr1-header, #cr1-button-flow .cr1-stop { min-height: 36px; }
      #cr1-button-flow .cr1-body { gap: 10px; padding: 7px 10px; }
      #cr1-button-flow .cr1-left { gap: 6px; }
      #cr1-button-flow .cr1-primary-row, #cr1-button-flow .cr1-pad { gap: 6px 8px; }
      #cr1-button-flow .cr1-left button {
        min-height: clamp(36px, 10svh, 44px); padding: 3px 5px;
      }
      #cr1-button-flow .cr1-action-options { gap: 6px 8px; }
      #cr1-button-flow .cr1-tools { gap: 4px; }
      #cr1-button-flow .cr1-tools span::before { width: 30px; height: 30px; background-size: 17px; }
      #cr1-button-flow .cr1-feedback { gap: 2px 10px; padding-top: 4px; }
      #cr1-button-flow .cr1-command-table { margin-top: 3px; }
    }
    @media (orientation: landscape) and (max-height: 420px) {
      #cr1-button-flow .cr1-tools span { display: flex; align-items: center; gap: 4px; }
      #cr1-button-flow .cr1-tools span::before { width: 24px; height: 24px; background-size: 15px; }
    }
  </style>
</head>
<body>
  <main id="cr1-button-flow">
    <header class="cr1-preview-header">
      <div>
        <h2>CR1PRO 手柄预览</h2>
        <span class="cr1-caption">离线模拟 · PRO SDK</span>
      </div>
    </header>
    <section class="cr1-device" aria-label="常规模式手柄界面">
      <header class="cr1-header">
        <div class="cr1-mode">
          <span class="cr1-back" aria-hidden="true"></span>
          <strong>常规模式</strong>
          <span class="cr1-mode-arrow" aria-hidden="true">▾</span>
        </div>
        <div class="cr1-top-right">
          <span class="cr1-settings" aria-hidden="true"></span>
          <span class="cr1-battery" aria-label="电量不可用">--%</span>
          <button type="button" class="cr1-stop" id="stop" aria-label="STOP（仅模拟）">STOP</button>
        </div>
      </header>
      <div class="cr1-body">
        <div class="cr1-left">
          <div class="cr1-row cr1-primary-row" role="group" aria-label="运动模式">
            <button type="button" id="hang" hidden>悬吊起立</button>
            <button type="button" id="squat" hidden>蹲姿起立</button>
            <button type="button" id="walk">开始运动</button>
            <button type="button" id="damping">阻尼模式</button>
            <div id="speed-control" class="cr1-speed-control" hidden>
              <button type="button" id="speed" class="cr1-speed" aria-controls="speed-panel" aria-expanded="false">速率</button>
              <div id="speed-panel" class="cr1-speed-panel" hidden>
                <input id="speed-range" type="range" min="0" max="100" value="50" aria-label="模拟速率">
                <output id="speed-value" for="speed-range">50%</output>
              </div>
            </div>
          </div>
          <div id="motions" class="cr1-pad" role="group" aria-label="RL 动作" hidden></div>
        </div>
        <aside class="cr1-tools" aria-label="原手柄右侧工具（离线占位）">
          <span data-tool="video">图传</span>
          <span data-tool="record">录像</span>
          <span data-tool="camera">拍照</span>
          <span data-tool="joints">关节参数</span>
          <span data-tool="motion">运动参数</span>
        </aside>
      </div>
    </section>

    <footer class="cr1-feedback" aria-live="polite" aria-atomic="true">
      <span class="cr1-caption">模拟反馈</span>
      <strong id="status">准备站姿</strong>
      <code id="state-code">0x20006</code>
      <span id="hint" class="cr1-caption">可点「开始运动」。</span>
    </footer>

    <details class="cr1-command-table">
      <summary>DDS 口令表</summary>
      <table>
        <thead><tr><th scope="col">手柄按钮</th><th scope="col">名称</th><th scope="col">DDS 口令</th></tr></thead>
        <tbody id="command-rows"></tbody>
      </table>
    </details>

    <dialog id="confirmation" aria-labelledby="dialog-title" aria-describedby="dialog-content">
      <h2 id="dialog-title"></h2>
      <p id="dialog-content"></p>
      <form method="dialog">
        <button type="submit" value="cancel">取消</button>
        <button type="submit" value="accept" id="dialog-accept">确定</button>
      </form>
    </dialog>
  </main>
  <script>
    const motionData = [
      [1, "站立", "0x1100B"],
      [2, "跑步", "0x1100C"],
      [3, "讲解", "0x1100D"],
      [4, "欢迎手势", "0x1100E"],
      [5, "敬礼", "0x1100F"],
      [6, "欢迎1", "0x11010"],
      [7, "欢迎2", "0x11011"],
      [8, "椅子坐姿", "0x11012"],
      [9, "坐姿起立", "0x11013"],
      [10, "拳击", "0x11014"],
      [11, "躺姿（SDK 保留，禁用）", "0x11015", false],
      [12, "躺姿起立（SDK 保留，禁用）", "0x11016", false],
    ];
    const actions = new Map(motionData.filter(([, , , visible]) => visible !== false)
      .map(([number, label, code]) => [number, { label, code }]));
    const modes = {
      idle: { label: "空闲", code: "0x0" },
      ready: { label: "准备站姿", code: "0x20006" },
      squat: { label: "蹲姿准备", code: "0x20010" },
      walking: { label: "RL模式", code: "0x11" },
      damping: { label: "关节阻尼", code: "0x2" },
    };
    const gestures = [3, 4, 5, 6, 7];
    const exits = new Map([
      ["idle", ["ready", "squat"]],
      ["ready", ["walking"]],
      ["squat", [9]],
      ["walking", [1, 2, ...gestures, 8, 10]],
      [1, ["walking", 2, ...gestures]],
      [2, ["walking", 1, ...gestures, 8]],
      ...gestures.map(number => [number, ["walking", 2, ...gestures.filter(gesture => gesture !== number)]]),
      [8, [9]],
      [9, ["walking"]],
      [10, ["walking"]],
    ]);
    // Preview timers model the successful feedback path of the handset and SDK.
    const standPreparationMs = 3000;
    const squatPreparationMs = 3300;
    const chairRiseMs = 360 * 20;
    const armLoweringMs = 2400;
    const dampingMs = 10000;

    const element = id => document.getElementById(id);
    const pad = element("motions");
    const hang = element("hang");
    const squat = element("squat");
    const walk = element("walk");
    const stop = element("stop");
    const damping = element("damping");
    const speedControl = element("speed-control");
    const speed = element("speed");
    const speedPanel = element("speed-panel");
    const dialog = element("confirmation");
    const actionButtons = new Map();
    const groups = [];
    let current = "ready";
    let waiting = "";
    let hint = "";
    let lastCommand = "";
    let timer;
    let confirmAction;

    for (const [number, { label, code }] of actions) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.motion = String(number);
      button.title = "DDS " + code;
      button.textContent = label;
      button.addEventListener("click", () => request(number));
      actionButtons.set(number, button);
    }

    function appendGroup(title, numbers, id) {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.setAttribute("aria-controls", id);
      const options = document.createElement("div");
      options.id = id;
      options.className = "cr1-action-options";
      options.setAttribute("role", "group");
      options.setAttribute("aria-label", title);
      options.append(...numbers.map(number => actionButtons.get(number)));
      const group = { title, toggle, options, expanded: false };
      groups.push(group);
      toggle.addEventListener("click", () => {
        group.expanded = !group.expanded;
        render();
      });
      pad.append(toggle, options);
    }

    pad.append(actionButtons.get(1), actionButtons.get(2));
    appendGroup("上肢手势", gestures, "cr1-preview-gestures");
    appendGroup("椅子动作", [8, 9], "cr1-preview-chair");
    pad.append(actionButtons.get(10));

    function canRequest(target) {
      if (waiting === "lowering") return target === 2;
      return !waiting && exits.get(current)?.includes(target) === true;
    }

    function setSpeedPanel(open) {
      speedPanel.hidden = !open;
      speed.setAttribute("aria-expanded", String(open));
    }

    function render() {
      const mode = modes[current] ?? actions.get(current);
      const inRlMenu = current === "walking" || actions.has(current);
      pad.hidden = !inRlMenu;
      for (const { title, toggle, options, expanded } of groups) {
        toggle.textContent = title + (expanded ? " ▴" : " ▾");
        toggle.setAttribute("aria-expanded", String(expanded));
        options.hidden = !expanded;
      }
      for (const [number, button] of actionButtons) {
        button.disabled = !canRequest(number);
        if (current === number) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      }

      hang.hidden = current !== "idle";
      hang.title = "DDS " + modes.ready.code;
      hang.disabled = !canRequest("ready");
      squat.hidden = current !== "idle" && current !== "squat";
      squat.textContent = current === "idle" ? "蹲姿起立" :
        (waiting ? "等待蹲姿稳定…" : "开始站立");
      squat.title = "DDS " + (current === "squat" ? actions.get(9).code : modes.squat.code);
      squat.disabled = !canRequest(current === "squat" ? 9 : "squat");
      walk.hidden = !inRlMenu && current !== "ready";
      walk.textContent = inRlMenu ? "RL模式" : "开始运动";
      walk.title = "DDS " + modes.walking.code;
      walk.disabled = !canRequest("walking");
      if (current === "walking") walk.setAttribute("aria-current", "true");
      else walk.removeAttribute("aria-current");
      damping.hidden = current !== "ready";
      damping.title = "DDS 0x2000F";
      stop.title = "DDS " + modes.damping.code;
      stop.disabled = current === "idle" || current === "damping";
      speedControl.hidden = !["walking", 2].includes(current);
      if (speedControl.hidden) setSpeedPanel(false);

      element("status").textContent = mode.label;
      element("state-code").textContent = mode.code;
      const instructions = hint || ({
        idle: "可选择「悬吊起立」或「蹲姿起立」。",
        ready: "可点「开始运动」。",
        squat: "可点「开始站立」。",
        8: "坐稳后可点「坐姿起立」。",
        9: "可点「RL模式」。",
      }[current] ?? "");
      element("hint").textContent = [lastCommand && "模拟指令 " + lastCommand, instructions]
        .filter(Boolean).join(" · ");
    }

    function enter(next) {
      clearTimeout(timer);
      current = next;
      waiting = "";
      hint = "";
      if (!actions.has(current) && current !== "walking") {
        for (const group of groups) group.expanded = false;
      }
    }

    function hold(reason, message, duration, finish = () => {}) {
      waiting = reason;
      hint = message;
      timer = setTimeout(() => {
        waiting = "";
        hint = "";
        finish();
        render();
      }, duration);
    }

    function request(target) {
      if (!canRequest(target)) return;
      lastCommand = (modes[target] ?? actions.get(target)).code;
      if (target === "walking" && gestures.includes(current)) {
        hold("lowering", "收臂到位后进入行走。", armLoweringMs, () => enter("walking"));
      } else {
        const previous = current;
        enter(target);
        if (target === "ready") hold("ready", "等待站立完成。", standPreparationMs);
        if (target === "squat") hold("squat", "等待蹲姿稳定。", squatPreparationMs);
        if (target === 9 && previous === 8) hold("rising", "等待坐姿起立完成。", chairRiseMs);
      }
      render();
    }

    function confirm(title, message, accept, callback) {
      element("dialog-title").textContent = title;
      element("dialog-content").textContent = message;
      element("dialog-accept").textContent = accept;
      confirmAction = callback;
      dialog.showModal();
    }

    dialog.querySelector("form").addEventListener("submit", event => {
      event.preventDefault();
      const callback = confirmAction;
      confirmAction = undefined;
      dialog.close();
      if (event.submitter?.value === "accept") callback?.();
    });
    dialog.addEventListener("cancel", () => { confirmAction = undefined; });
    hang.addEventListener("click", () => confirm("悬吊起立", "请确认机器人处于悬吊状态且双脚离地。",
      "确定，下一步", () => request("ready")));
    walk.addEventListener("click", () => {
      if (current === "ready") {
        confirm("悬吊起立", "请确认机器人的双脚完全接触地面。", "确定，开始运动", () => request("walking"));
      } else {
        request("walking");
      }
    });
    squat.addEventListener("click", () => {
      if (current === "squat") {
        confirm("开始站立", "请确认机器人已稳定保持蹲姿。", "确定", () => request(9));
      } else {
        confirm("蹲姿起立", "请确认机器人周围无人员及障碍物。", "确定", () => request("squat"));
      }
    });
    damping.addEventListener("click", () => confirm("阻尼模式", "请确认机器人已有可靠支撑。",
      "确定", () => {
        lastCommand = "0x2000F";
        hint = "当前 SDK 拒绝这条口令；顶部 STOP 使用 0x2。";
        render();
      }));
    speed.addEventListener("click", () => setSpeedPanel(speedPanel.hidden));
    element("speed-range").addEventListener("input", event => {
      element("speed-value").value = event.target.value + "%";
    });
    stop.addEventListener("click", () => {
      if (stop.disabled) return;
      enter("damping");
      lastCommand = modes.damping.code;
      hold("damping", "约 10 秒后自动回到空闲。", dampingMs, () => enter("idle"));
      render();
    });

    const commandRows = [
      ["悬吊起立", "准备站姿", modes.ready.code],
      ["蹲姿起立", "蹲姿准备", modes.squat.code],
      ["开始运动 / RL模式", "拟人行走", modes.walking.code],
      ...motionData.map(([number, label, code]) => [
        number === 9 ? "motion_9 / 开始站立" : "motion_" + number, label, code,
      ]),
      ["顶部 STOP", "关节阻尼", modes.damping.code],
      ["阻尼模式", "当前 SDK 拒绝", "0x2000F"],
    ];
    for (const fields of commandRows) {
      const row = element("command-rows").insertRow();
      for (const field of fields) row.insertCell().textContent = field;
    }
    render();
  </script>
</body>
</html>
