# =====================================================================
# runtime_params.toml —— 机器人当前生效参数值（运行期实时快照）
# =====================================================================
# 用途：
#   - 由 utils/runtime_params.hpp 模块在运行期周期性回写
#   - 反映各模块（SafeController / JointProtection / TerrainPolicy 等）
#     实际加载并使用的参数值，便于在线诊断与可视化展示
# 注意：
#   - 该文件由程序自动覆盖，请勿手动编辑（编辑会在下一次写入时丢失）
#   - 文件首行写入时间戳，便于判断是否实时更新
#   - 全部节段与字段在程序启动后由各模块通过 RuntimeParams::Set* 动态写入
# =====================================================================
